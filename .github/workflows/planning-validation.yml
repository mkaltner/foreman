name: Planning and documentation validation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - "planning/**"
      - "scripts/validate-planning.py"
      - ".github/workflows/planning-validation.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - "planning/**"
      - "scripts/validate-planning.py"
      - ".github/workflows/planning-validation.yml"

permissions:
  contents: read

jobs:
  validate-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate planning and documentation
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-planning.py
