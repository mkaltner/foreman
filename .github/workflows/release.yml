name: Tagged release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v0.0.1" >&2
            exit 1
          fi
      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Android signing secrets are not configured; see docs/releasing.md" >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/foreman-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          {
            echo "FOREMAN_ANDROID_KEYSTORE=$keystore_path"
            echo "FOREMAN_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FOREMAN_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "FOREMAN_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Test Linux service
        run: |
          python -m compileall -q linux scripts tests
          python -m unittest discover -s tests -v
      - name: Test and build web client
        working-directory: web
        run: npm ci && npm test && npm run typecheck && npm run build
      - name: Test and build signed Android APK
        working-directory: android
        run: >-
          ./gradlew --no-daemon test lint assembleRelease
          -PforemanVersionName="${RELEASE_TAG#v}"
          -PforemanVersionCode="$GITHUB_RUN_NUMBER"
      - name: Verify and package release files
        run: |
          mkdir -p dist
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner_path="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose "$apk"
          cp "$apk" "dist/foreman-${RELEASE_TAG}.apk"
          tar -czf "dist/foreman-linux-${RELEASE_TAG}.tar.gz" install.sh requirements.txt linux web/dist scripts/vendor_python_dependencies.sh docs README.md
          (cd dist && sha256sum foreman-* > SHA256SUMS)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            "$RELEASE_TAG" dist/*
            --verify-tag
            --title "Foreman $RELEASE_TAG"
          )
          notes_file="docs/releases/${RELEASE_TAG#v}.md"
          if [[ -f "$notes_file" ]]; then
            release_args+=(--notes-file "$notes_file")
          else
            release_args+=(--generate-notes)
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
