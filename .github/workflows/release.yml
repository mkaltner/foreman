name: Tagged release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v0.0.1" >&2
            exit 1
          fi
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)"
          python scripts/verify_release.py --tag "$RELEASE_TAG"
      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Android signing secrets are not configured; see docs/releasing.md" >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/foreman-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          {
            echo "FOREMAN_ANDROID_KEYSTORE=$keystore_path"
            echo "FOREMAN_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FOREMAN_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "FOREMAN_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Test Linux service
        run: |
          python -m compileall -q linux scripts tests
          python -m unittest discover -s tests -v
      - name: Build optional Claude Code bridge
        working-directory: linux/claude_bridge
        run: |
          npm ci --omit=dev --ignore-scripts
          npm run build
          npm test
          git diff --exit-code -- package-lock.json bridge.mjs
      - name: Test and build web client
        working-directory: web
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
          git diff --exit-code -- dist
      - name: Test and build signed Android APK
        working-directory: android
        run: ./gradlew --no-daemon test lint assembleRelease
      - name: Verify and package release files
        run: |
          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          mkdir -p dist
          apk="android/app/build/outputs/apk/release/app-release.apk"
          [[ -f "$apk" ]] || fail "Signed release APK was not produced at $apk"
          cp "$apk" "dist/foreman-${RELEASE_TAG}.apk"
          tar --exclude='__pycache__' --exclude='*.py[co]' \
            --exclude='linux/claude_bridge/bridge.test.mjs' \
            --exclude='linux/claude_bridge/test_fake_sdk.mjs' \
            --exclude='linux/claude_bridge/node_modules/.bin' \
            -czf "dist/foreman-linux-${RELEASE_TAG}.tar.gz" \
            install.sh release.properties requirements.txt linux web/dist \
            scripts/vendor_python_dependencies.sh docs README.md LICENSE THIRD_PARTY_NOTICES.md
          (cd dist && sha256sum foreman-* > SHA256SUMS)
          bash scripts/sign_release_manifest.sh dist/SHA256SUMS dist
          bash scripts/verify_release_payload.sh "$RELEASE_TAG" dist
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::A GitHub release already exists for $RELEASE_TAG; inspect and remove only an unpublished draft before retrying" >&2
            exit 1
          fi
          release_args=(
            "$RELEASE_TAG"
            --draft
            --verify-tag
            --title "Foreman $RELEASE_TAG"
          )
          notes_file="docs/releases/${RELEASE_TAG#v}.md"
          if [[ -f "$notes_file" ]]; then
            release_args+=(--notes-file "$notes_file")
          else
            release_args+=(--generate-notes)
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
      - name: Upload and verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*
          manifest="$RUNNER_TEMP/foreman-release-manifest.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$manifest"
          python3 scripts/verify_release_assets.py --tag "$RELEASE_TAG" --manifest "$manifest"

          downloaded="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --dir "$downloaded"
          bash scripts/verify_release_payload.sh "$RELEASE_TAG" "$downloaded"
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
          published="$RUNNER_TEMP/foreman-published-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$published"
          python3 scripts/verify_release_assets.py --tag "$RELEASE_TAG" --manifest "$published"
          python3 - "$published" <<'PY'
          import json
          import sys

          release = json.load(open(sys.argv[1], encoding="utf-8"))
          if release.get("draft") is not False or not release.get("published_at"):
              raise SystemExit("verified release was not published")
          print("verified GitHub release is published")
          PY
      - name: Upload failed release candidate
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-release-${{ env.RELEASE_TAG }}-${{ github.run_id }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 1
