name: Tagged release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v0.0.1" >&2
            exit 1
          fi
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)"
          python scripts/verify_release.py --tag "$RELEASE_TAG"
      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Android signing secrets are not configured; see docs/releasing.md" >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/foreman-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          {
            echo "FOREMAN_ANDROID_KEYSTORE=$keystore_path"
            echo "FOREMAN_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FOREMAN_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "FOREMAN_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Test Linux service
        run: |
          python -m compileall -q linux scripts tests
          python -m unittest discover -s tests -v
      - name: Test and build web client
        working-directory: web
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
          git diff --exit-code -- dist
      - name: Test and build signed Android APK
        working-directory: android
        run: ./gradlew --no-daemon test lint assembleRelease
      - name: Verify and package release files
        run: |
          fail() {
            echo "::error::$1" >&2
            exit 1
          }
          require_archive_entry() {
            grep -Fxq "$1" <<<"$archive_listing" || fail "Linux archive is missing $1"
          }

          mkdir -p dist
          apk="android/app/build/outputs/apk/release/app-release.apk"
          [[ -f "$apk" ]] || fail "Signed release APK was not produced at $apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner_path="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt2_path="$(find "$sdk_root/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          [[ -x "$apksigner_path" ]] || fail "Android apksigner was not found"
          [[ -x "$aapt2_path" ]] || fail "Android aapt2 was not found"
          expected_version="$(sed -n 's/^foremanVersion=//p' release.properties)"
          expected_code="$(sed -n 's/^androidVersionCode=//p' release.properties)"
          expected_cert="$(sed -n 's/^androidSigningCertificateSha256=//p' release.properties)"
          badging="$("$aapt2_path" dump badging "$apk" | sed -n '1p')"
          grep -Fq "versionName='$expected_version'" <<<"$badging" || fail "APK version name does not match release.properties"
          grep -Fq "versionCode='$expected_code'" <<<"$badging" || fail "APK version code does not match release.properties"
          signing="$("$apksigner_path" verify --verbose --print-certs "$apk")"
          grep -Fq 'Verifies' <<<"$signing" || fail "APK signature verification failed"
          actual_cert="$(sed -nE 's/^Signer #1 certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f]+)[[:space:]]*$/\1/p' <<<"$signing" | tr 'A-F' 'a-f')"
          [[ -n "$actual_cert" && "$actual_cert" == "$expected_cert" ]] || fail "APK signing certificate does not match release.properties"
          cp "$apk" "dist/foreman-${RELEASE_TAG}.apk"
          tar --exclude='__pycache__' --exclude='*.py[co]' \
            -czf "dist/foreman-linux-${RELEASE_TAG}.tar.gz" \
            install.sh release.properties requirements.txt linux web/dist \
            scripts/vendor_python_dependencies.sh docs README.md THIRD_PARTY_NOTICES.md
          archive="dist/foreman-linux-${RELEASE_TAG}.tar.gz"
          archive_listing="$(tar -tzf "$archive")"
          require_archive_entry 'linux/vendor/websockets-16.1.1.dist-info/licenses/LICENSE'
          require_archive_entry 'web/dist/index.html'
          require_archive_entry 'release.properties'
          require_archive_entry 'THIRD_PARTY_NOTICES.md'
          if grep -Eq '(^|/)(__pycache__/|[^/]+\.py[co]$)' <<<"$archive_listing"; then
            echo "Linux archive contains Python cache files" >&2
            exit 1
          fi
          (cd dist && sha256sum foreman-* > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Upload failed release candidate
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-release-${{ env.RELEASE_TAG }}-${{ github.run_id }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            "$RELEASE_TAG" dist/*
            --verify-tag
            --title "Foreman $RELEASE_TAG"
          )
          notes_file="docs/releases/${RELEASE_TAG#v}.md"
          if [[ -f "$notes_file" ]]; then
            release_args+=(--notes-file "$notes_file")
          else
            release_args+=(--generate-notes)
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
