name: Build skeleton validation

on:
  pull_request:
    paths:
      - ".github/workflows/build-skeletons.yml"
      - ".node-version"
      - ".nvmrc"
      - "android/**"
      - "companion/**"
      - "protocol/**"
      - "test-fixtures/**"
      - "docs/protocol-v1.md"
      - "spec.md"
      - "docs/adr/0001-stack-versions.md"
      - "docs/development.md"
      - "planning/**"
      - "scripts/validate-planning.py"
      - "scripts/validate-security.py"
      - "docs/security-private-alpha.md"
      - "docs/private-alpha-acceptance.md"
      - "acceptance/**"
      - "scripts/validate-acceptance.py"
      - "release/**"
      - "docs/private-alpha-installation.md"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-skeletons.yml"
      - ".node-version"
      - ".nvmrc"
      - "android/**"
      - "companion/**"
      - "protocol/**"
      - "test-fixtures/**"
      - "docs/protocol-v1.md"
      - "spec.md"
      - "docs/adr/0001-stack-versions.md"
      - "docs/development.md"
      - "planning/**"
      - "scripts/validate-planning.py"
      - "scripts/validate-security.py"
      - "docs/security-private-alpha.md"
      - "docs/private-alpha-acceptance.md"
      - "acceptance/**"
      - "scripts/validate-acceptance.py"
      - "release/**"
      - "docs/private-alpha-installation.md"
      - "README.md"

permissions:
  contents: read

jobs:
  validate-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate planning and documentation
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-planning.py
      - name: Validate security and privacy boundaries
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-security.py
      - name: Validate private-alpha lifecycle evidence
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-acceptance.py

  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Verify Node and npm pins
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - name: Install locked dependencies
        working-directory: companion
        run: npm ci
      - name: Audit production dependency vulnerabilities
        working-directory: companion
        run: npm audit --omit=dev --audit-level=high
      - name: Build and validate companion including database, discovery, supervisor, and transport
        working-directory: companion
        run: npm run build && npm run validate

  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Install locked schema validator
        working-directory: companion
        run: npm ci
      - name: Validate frozen protocol
        run: node protocol/scripts/validate-protocol.mjs

  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Install locked schema validator
        working-directory: companion
        run: npm ci
      - name: Validate frozen protocol first
        run: node protocol/scripts/validate-protocol.mjs
      - name: Validate permanent fixtures and provenance
        run: node test-fixtures/scripts/validate-fixtures.mjs
      - name: Validate planning, links, and repository scans
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate-planning.py

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify JDK 21 daemon and provisioned Java 17 compiler toolchain
        working-directory: android
        run: |
          java -version
          ./gradlew --version
          ./gradlew -q javaToolchains
      - name: Install selected Android SDK packages
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" "platforms;android-36" "build-tools;35.0.0"
      - name: Validate Android skeleton
        working-directory: android
        run: >-
          ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug
          compileDebugAndroidTestKotlin assemblePrivateAlpha lintPrivateAlpha

  private-alpha-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install selected Android SDK packages
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" "platforms;android-36" "build-tools;35.0.0"
      - name: Install locked companion dependencies
        working-directory: companion
        run: npm ci
      - name: Build and validate private-alpha artifacts without publishing
        run: |
          mkdir -p companion/dist/src
          touch companion/dist/src/foreman-stale-build-sentinel.js
          node release/build-private-alpha.mjs
          node release/validate-private-alpha.mjs
