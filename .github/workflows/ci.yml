name: Build and test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-service:
    name: Linux service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux service dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q linux tests
      - name: Run Linux service tests
        run: python -m unittest discover -s tests -v
      - name: Package Linux service
        run: tar -czf foreman-linux.tar.gz install.sh requirements.txt linux docs README.md
      - name: Verify Linux archive
        run: tar -tzf foreman-linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: foreman-linux
          path: foreman-linux.tar.gz
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and build debug APK
        working-directory: android
        run: ./gradlew --no-daemon test lint assembleDebug
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foreman-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
