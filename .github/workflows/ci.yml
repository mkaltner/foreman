name: Build and test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Test, type check, and build web client
        working-directory: web
        run: npm test && npm run typecheck && npm run build
      - name: Verify committed web assets are current
        run: |
          git diff --exit-code -- web/dist
          test -f web/dist/index.html
          compgen -G 'web/dist/assets/*' >/dev/null

  linux-service:
    name: Linux service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify vendored Python dependency
        run: >-
          PYTHONPATH=linux/vendor python -c
          "import pathlib, websockets;
          assert websockets.__version__ == '16.1.1';
          assert 'linux/vendor' in pathlib.Path(websockets.__file__).as_posix()"
      - name: Verify release metadata
        run: python scripts/verify_release.py
      - name: Compile Python sources
        run: python -m compileall -q linux scripts tests
      - name: Run Linux service tests
        run: python -m unittest discover -s tests -v
      - name: Package Linux service
        run: |
          tar --exclude='__pycache__' --exclude='*.py[co]' -czf foreman-linux.tar.gz \
            install.sh release.properties requirements.txt linux web/dist \
            scripts/vendor_python_dependencies.sh docs README.md THIRD_PARTY_NOTICES.md
      - name: Verify Linux archive
        run: |
          archive_listing="$(tar -tzf foreman-linux.tar.gz)"
          printf '%s\n' "$archive_listing"
          grep -Fxq 'linux/vendor/websockets-16.1.1.dist-info/licenses/LICENSE' <<<"$archive_listing"
          grep -Fxq 'web/dist/index.html' <<<"$archive_listing"
          grep -Fxq 'release.properties' <<<"$archive_listing"
          grep -Fxq 'THIRD_PARTY_NOTICES.md' <<<"$archive_listing"
          if grep -Eq '(^|/)(__pycache__/|[^/]+\.py[co]$)' <<<"$archive_listing"; then
            echo "Linux archive contains Python cache files" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: foreman-linux
          path: foreman-linux.tar.gz
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and build debug APK
        working-directory: android
        run: ./gradlew --no-daemon test lint assembleDebug
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foreman-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
